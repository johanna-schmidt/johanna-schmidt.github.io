<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histogram Binning Uncertainty</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/plot.css">
</head>
<body>
  <main>
    <header>
      <h1>Histogram Binning Uncertainty</h1>
      <p class="subtitle">Explore the uncertainty of different binnings and check whether the binning matches your data</p>
    </header>

    <section class="controls" aria-label="Data selection">
      <div class="control">
        <label for="dist-select">Distribution</label>
        <select id="dist-select" disabled></select>
      </div>

      <div class="control">
        <span class="label" id="size-label">Sample size</span>
        <div id="size-buttons" class="segmented" role="radiogroup" aria-labelledby="size-label"></div>
      </div>
    </section>

    <section class="chart-card">
      <span id="accuracy-badge" class="badge" role="status" aria-live="polite"></span>
      <div id="chart" class="chart" role="img" aria-label="Histogram with error bars"></div>
      <div id="message" class="message" hidden></div>

      <div class="chart-controls">
        <div class="control control-slider">
          <label for="bin-slider">Bins <output id="bin-value" for="bin-slider">20</output></label>
          <input id="bin-slider" type="range" min="1" max="300" value="20" step="1">
        </div>

        <div class="toggles">
          <label class="switch">
            <input id="uncertainty-toggle" type="checkbox" role="switch" checked>
            <span class="switch-track" aria-hidden="true"></span>
            <span class="switch-label">Show Uncertainty</span>
          </label>
          <div id="uncertainty-type" class="segmented segmented-sm" role="radiogroup" aria-label="Uncertainty visualization">
            <button type="button" role="radio" data-type="errorbars" aria-checked="true">Error Bars</button>
            <button type="button" role="radio" data-type="gradient" aria-checked="false">Gradient</button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>

  <script src="lib/d3.min.js"></script>
  <script src="js/globals.js"></script>
  <script src="js/statistics.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/plot.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Init application
    Init();
    // Handle resize events
    let resizeTimer;
    const scheduleRender = () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(UpdatePlot, 100);
    };
    new ResizeObserver(scheduleRender).observe(ui.chart);
    window.addEventListener('resize', scheduleRender);

  </script>
</body>
</html>
